<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Akan Name Generator</h1>

    <p>Enter your birth details to discover your Ghanaian Akan name.</p>

    <form id="akanForm">

        <label for="day">Day</label>
        <input type="number" id="day" min="1" max="31" placeholder="Enter day">

        <label for="month">Month</label>
        <input type="number" id="month" min="1" max="12" placeholder="Enter month">

        <label for="year">Year</label>
        <input type="number" id="year" placeholder="Enter year">

        <label>Gender</label>

        <div class="gender">
            <label>
                <input type="radio" name="gender" value="male">
                Male
            </label>

            <label>
                <input type="radio" name="gender" value="female">
                Female
            </label>
        </div>

        <button type="button">Generate Akan Name</button>

    </form>

    <div id="result">
        <h2>Your Akan Name Will Appear Here</h2>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
